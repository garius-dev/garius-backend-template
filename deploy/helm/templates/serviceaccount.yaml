{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "garius.serviceAccountName" . }}
  labels:
    {{- include "garius.labels" . | nindent 4 }}
# A aplicação NÃO fala com a API do Kubernetes. Montar o token é dar um
# credencial que ninguém usa — e que um atacante com execução no container usaria.
automountServiceAccountToken: false
{{- end }}
